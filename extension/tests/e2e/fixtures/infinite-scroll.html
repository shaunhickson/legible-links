<!DOCTYPE html>
<html>
<head><title>Infinite Scroll Test</title></head>
<body>
  <div id="container"></div>
  <script>
    const container = document.getElementById('container');
    for (let i = 0; i < 50; i++) {
      const p = document.createElement('p');
      p.innerHTML = `<a href="https://example.org/scroll/${i}">https://example.org/scroll/${i}</a>`;
      container.appendChild(p);
    }
  </script>
</body>
</html>
