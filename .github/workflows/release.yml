name: Release

# Tagging vX.Y.Z builds the extension zip (for the Chrome Web Store and
# Firefox Add-ons), a source zip (Mozilla requires it for bundled code),
# and the backend container image on GHCR, then publishes a GitHub Release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  packages: write

jobs:
  extension:
    name: Build extension
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Version must match the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./extension/public/manifest.json').version")
          pkg=$(node -p "require('./extension/package.json').version")
          echo "tag=$tag manifest=$manifest package=$pkg"
          [ "$tag" = "$manifest" ] && [ "$tag" = "$pkg" ] || { echo "version mismatch"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Install
        run: cd extension && npm ci

      - name: Lint, test, build
        run: |
          cd extension
          npm run lint
          npx vitest run
          npm run build

      - name: Package
        run: |
          v="${{ steps.version.outputs.version }}"
          (cd extension/dist && zip -qr "../../legible-links-extension-$v.zip" .)
          git archive --format=zip --prefix="legible-links-$v/" -o "legible-links-source-$v.zip" HEAD extension LICENSE README.md
          ls -la legible-links-*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-zips
          path: legible-links-*.zip

  backend-image:
    name: Publish backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          v="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${{ github.repository_owner }}/legible-links-backend"
          docker build -t "$image:$v" -t "$image:latest" ./backend
          docker push "$image:$v"
          docker push "$image:latest"

  release:
    name: GitHub Release
    needs: [extension, backend-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download zips
        uses: actions/download-artifact@v8
        with:
          name: release-zips

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.extension.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Legible Links $v" \
            --generate-notes \
            legible-links-extension-$v.zip legible-links-source-$v.zip
