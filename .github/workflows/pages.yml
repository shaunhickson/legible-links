name: Website

on:
  push:
    branches: [ main ]
    paths: [ 'website/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install
        run: cd website && npm ci

      - name: Build
        # SITE_BASE_PATH is a repository variable: "/legible-links" while the
        # site lives under shaunhickson.github.io, "" once a custom domain is set.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/legible-links' }}
        run: cd website && npm run build

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
